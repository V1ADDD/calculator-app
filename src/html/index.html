<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator App</title>
  </head>
  <body>
    <div class="calculator">
      <div class="calculator__display">
        <span class="calculator__operation"></span>
        <span class="calculator__result">0</span>
      </div>
      <div class="calculator__buttons">
        <button
          class="calculator__button calculator__button--control"
          data-action="clear"
        >
          C
        </button>
        <button
          class="calculator__button calculator__button--control"
          data-action="sign"
        >
          ±
        </button>
        <button
          class="calculator__button calculator__button--operator"
          data-operator="percent"
        >
          %
        </button>
        <button
          class="calculator__button calculator__button--operator"
          data-operator="divide"
        >
          ÷
        </button>
        <button class="calculator__button" data-value="7">7</button>
        <button class="calculator__button" data-value="8">8</button>
        <button class="calculator__button" data-value="9">9</button>
        <button
          class="calculator__button calculator__button--operator"
          data-operator="multiply"
        >
          ×
        </button>
        <button class="calculator__button" data-value="4">4</button>
        <button class="calculator__button" data-value="5">5</button>
        <button class="calculator__button" data-value="6">6</button>
        <button
          class="calculator__button calculator__button--operator"
          data-operator="subtract"
        >
          −
        </button>
        <button class="calculator__button" data-value="1">1</button>
        <button class="calculator__button" data-value="2">2</button>
        <button class="calculator__button" data-value="3">3</button>
        <button
          class="calculator__button calculator__button--operator"
          data-operator="add"
        >
          +
        </button>
        <button
          class="calculator__button calculator__button--wide"
          data-value="0"
        >
          0
        </button>
        <button class="calculator__button" data-value=".">.</button>
        <button
          class="calculator__button calculator__button--control"
          data-action="equals"
        >
          =
        </button>
      </div>
    </div>
  </body>
</html>
